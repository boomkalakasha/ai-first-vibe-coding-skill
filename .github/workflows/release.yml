name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: publish-release
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-25
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, reviewed 2026-08-25
        with:
          python-version: "3.12"
      - name: Fetch every public branch ref for the history boundary
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Validate tag and metadata version
        id: release-metadata
        shell: pwsh
        run: |
          if ($env:TAG_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Unsupported release tag: $env:TAG_NAME"
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag is not on origin/main" }
          $tagVersion = $env:TAG_NAME.TrimStart("v")
          $skillVersion = (Select-String -Path SKILL.md -Pattern '^  version: "(.+)"$').Matches.Groups[1].Value
          if ($tagVersion -ne $skillVersion) { throw "Tag $tagVersion does not match Skill $skillVersion" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$tagVersion"
      - name: Verify dynamic README release facts
        uses: boomkalakasha/icarus-open-source-governance-skill/actions/release-doc-sync@12999d05ccc73800b5d6c49b709e2f09e8303519
        with:
          tag: ${{ env.TAG_NAME }}
          version: ${{ steps.release-metadata.outputs.version }}
          repository: ${{ github.repository }}
      - name: Validate and package
        shell: pwsh
        run: |
          python scripts/validate.py
          python scripts/check_history_boundaries.py
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/run_evals.py
          $version = $env:TAG_NAME.TrimStart("v")
          ./scripts/package.ps1 -Release -Version $version
      - name: Create and verify draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          export EXPECTED_TAG="${TAG_NAME}"
          existing_release_count="$(
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              python3 -c 'import json, os, sys; pages = json.load(sys.stdin); print(sum(1 for page in pages for release in page if release.get("tag_name") == os.environ["EXPECTED_TAG"]))'
          )"
          if [[ "${existing_release_count}" != "0" ]]; then
            echo "Refusing to reuse an existing release or draft for ${TAG_NAME}" >&2
            exit 1
          fi
          draft_url="$(
            gh release create "${TAG_NAME}" \
              "dist/ai-first-vibe-coding-${version}.zip" \
              dist/ai-first-vibe-coding.skill \
              dist/manifest.json \
              dist/SHA256SUMS.txt \
              --verify-tag --generate-notes --draft --title "${TAG_NAME}"
          )"
          test -n "${draft_url}"
          actual_asset_lines=""
          for attempt in 1 2 3 4 5; do
            set +e
            actual_asset_lines="$(
              gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
                python3 -c 'import json, os, sys; pages = json.load(sys.stdin); matches = [release for page in pages for release in page if release.get("draft") and release.get("tag_name") == os.environ["EXPECTED_TAG"]]; len(matches) == 1 or sys.exit(f"expected one new draft release, found {len(matches)}"); assets = matches[0].get("assets", []); len(assets) == 4 or sys.exit(f"expected four uploaded assets, found {len(assets)}"); print("\n".join(sorted(asset["name"] for asset in assets)))'
            )"
            lookup_status=$?
            set -e
            if [[ ${lookup_status} -eq 0 ]]; then
              break
            fi
            if [[ ${attempt} -eq 5 ]]; then
              exit "${lookup_status}"
            fi
            sleep 2
          done
          mapfile -t actual_assets <<< "${actual_asset_lines}"
          expected_assets=(
            "SHA256SUMS.txt"
            "ai-first-vibe-coding-${version}.zip"
            "ai-first-vibe-coding.skill"
            "manifest.json"
          )
          if ! diff -u <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${actual_assets[@]}"); then
            echo "Draft release assets differ from the reviewed package" >&2
            exit 1
          fi
          {
            echo "### Draft release ready"
            echo
            echo "Review and publish this exact CI-created draft: ${draft_url}"
            echo
            printf -- '- `%s`\n' "${actual_assets[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
