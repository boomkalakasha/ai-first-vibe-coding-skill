name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate-skill
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-25
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0, reviewed 2026-08-25
        with:
          python-version: "3.12"
      - name: Fetch every public branch ref for the history boundary
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Validate repository
        run: |
          python scripts/validate.py
          python scripts/check_history_boundaries.py
      - name: Run deterministic tests and rubric check
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/run_evals.py
      - name: Package skill
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload package evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-first-vibe-coding-skill
          path: dist/*
          if-no-files-found: error
