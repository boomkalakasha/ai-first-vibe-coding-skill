name: Feature request
description: Propose a generalizable workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current evidence and examples
      description: Use generic or fully redacted examples only.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed acceptance cases
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Contribution boundary
      options:
        - label: I can share all included material under Apache-2.0 and removed confidential data.
          required: true
